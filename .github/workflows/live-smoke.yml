name: Live Credential Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Read-only provider to verify
        required: true
        default: BOTH
        type: choice
        options:
          - BOTH
          - KIS
          - FRED

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_TARGET: ${{ inputs.target }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SMOKE_TARGET" == "KIS" || "$SMOKE_TARGET" == "BOTH" ]]; then
            test -n "$KIS_APP_KEY" || { echo "Missing repository secret KIS_APP_KEY"; exit 1; }
            test -n "$KIS_APP_SECRET" || { echo "Missing repository secret KIS_APP_SECRET"; exit 1; }
          fi
          if [[ "$SMOKE_TARGET" == "FRED" || "$SMOKE_TARGET" == "BOTH" ]]; then
            test -n "$FRED_API_KEY" || { echo "Missing repository secret FRED_API_KEY"; exit 1; }
          fi
      - name: Run read-only live smoke
        run: gradle liveSmoke --no-daemon
